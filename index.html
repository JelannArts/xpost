<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Post Template | Jelann Arts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lilita+One&family=Dela+Gothic+One&family=Permanent+Marker&family=Cinzel:wght@700&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#171717;--line:#2c2c2c;--text:#f2f0ea;--soft:#9a9a9a;--orange:#ff8a3d;--a2:#ff4d6d}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:28px 20px 60px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:26px;font-weight:500;letter-spacing:-.01em}
.lead{color:var(--soft);margin:8px 0 22px;font-size:15px}
#stage{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);flex:1 1 200px}
input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none}
select{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font:inherit;font-size:15px}
[hidden]{display:none!important}
input[type=color]{width:100%;height:42px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--orange);margin-top:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 16px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
button:hover{border-color:var(--orange)}
button.go{background:linear-gradient(100deg,var(--orange),var(--a2));border-color:transparent;color:#161616;font-weight:700}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);padding:11px 4px}
.note{margin-top:14px;font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Twitter / X post template</h1>
  <p class="lead">Click or drop an image onto each frame (drop outside the frames to set the background), type the game title, then download the PNG (2400 &times; 1350, 16:9).</p>
  <canvas id="stage" width="2400" height="1350" role="img" aria-label="Post preview. Use the buttons below to add images."></canvas>
  <div class="row">
    <label class="f" style="flex:0 0 190px">Layout<select id="layout"><option value="showcase">Showcase</option><option value="ba">Before / After</option></select></label>
    <button type="button" data-pick="thumb" data-for="showcase">Choose thumbnail</button>
    <button type="button" data-pick="logo" data-for="showcase">Choose logo</button>
    <button type="button" data-pick="icon" data-for="showcase">Choose icon</button>
    <button type="button" data-pick="before" data-for="ba" hidden>Choose BEFORE logo</button>
    <button type="button" data-pick="after" data-for="ba" hidden>Choose AFTER logo</button>
    <label class="chk" data-for="ba" hidden><input type="checkbox" id="mute"> Mute BEFORE (greyscale)</label>
    <label class="chk"><input type="checkbox" id="frames" checked> Card outlines</label>
    <label class="f" style="flex:0 0 170px">Accent style<select id="preset"><option value="sunset">Sunset</option><option value="ember">Ember</option><option value="electric">Electric</option><option value="aurora">Aurora</option><option value="orchid">Orchid</option><option value="gold">Gold</option></select></label>
    <label class="f" style="flex:0 0 90px">Accent 1<input type="color" id="ac1" value="#ff8a3d"></label>
    <label class="f" style="flex:0 0 90px">Accent 2<input type="color" id="ac2" value="#ff4d6d"></label>
  </div>
  <div class="row">
    <button type="button" data-pick="bg">Choose background</button>
    <button type="button" id="bgclear">Remove background</button>
    <label class="f" style="flex:0 0 130px">Background color<input type="color" id="bgcolor" value="#151515"></label>
    <label class="f">Background opacity: <span id="opv">40%</span><input type="range" id="bgop" min="0" max="100" value="40"></label>
    <label class="f">Panel opacity: <span id="pov">0%</span><input type="range" id="panelop" min="0" max="100" value="0"></label>
    <label class="f">Frosted glass: <span id="frv">18px</span><input type="range" id="frost" min="0" max="40" value="18"></label>
    <label class="f">Background blur: <span id="blv">0px</span><input type="range" id="bgblur" min="0" max="40" value="0"></label>
  </div>
  <div class="row">
    <label class="f">Game title<input type="text" id="title" value="Game Title" maxlength="40"></label>
    <label class="f" style="flex:0 0 170px">Title font<select id="tfont"><option value="clean">Clean</option><option value="cartoony">Cartoony</option><option value="anime">Anime</option><option value="grunge">Grunge</option><option value="real">Semi-realism</option><option value="bold">Bold</option></select></label>
    <label class="f">Right label<input type="text" id="brand" value="Jelann Arts" maxlength="30"></label>
    <button type="button" id="reset">Reset</button>
    <button type="button" class="go" id="dl">Download PNG</button>
  </div>
  <p class="note">Images stay on your device. They are only used to draw this preview and the PNG.</p>
</div>
<script>
const W=1200,H=675,S=2;
const FONTS={clean:{f:'Inter',w:600,s:54,sp:2},cartoony:{f:'Lilita One',w:400,s:58,sp:1},anime:{f:'Dela Gothic One',w:400,s:48,sp:1},grunge:{f:'Permanent Marker',w:400,s:52,sp:1},real:{f:'Cinzel',w:700,s:48,sp:3},bold:{f:'Bebas Neue',w:400,s:68,sp:3}};
const PRESETS={sunset:['#ff8a3d','#ff4d6d'],ember:['#e8792b','#e8792b'],electric:['#3da5ff','#7a5cff'],aurora:['#2de2b3','#3da5ff'],orchid:['#c77dff','#ff5fa2'],gold:['#f5c451','#e8923a']};
const A=()=>[document.getElementById('ac1').value,document.getElementById('ac2').value];
const rgba=(h,a)=>{const n=parseInt(h.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`;};
function grad(x,y,w,h){const [c1,c2]=A();const g=ctx.createLinearGradient(x,y,x+w,y+h);g.addColorStop(0,c1);g.addColorStop(1,c2);return g;}
const LAY={showcase:{thumb:{x:40,y:40,w:816,h:459},logo:{x:884,y:40,w:276,h:276},icon:{x:884,y:344,w:276,h:155}},
  ba:{before:{x:40,y:40,w:546,h:459},after:{x:614,y:40,w:546,h:459}}};
let layout='showcase',R=LAY.showcase;
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let img={thumb:null,logo:null,icon:null,bg:null,before:null,after:null},hot=null;
const F='Inter,system-ui,sans-serif';
const rp=(x,y,w,h,r)=>{ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
const rr=(x,y,w,h,r)=>{ctx.beginPath();rp(x,y,w,h,r);};
const tw=(t,sp)=>{const ch=[...t];return ch.reduce((a,c)=>a+ctx.measureText(c).width,0)+sp*Math.max(0,ch.length-1);};
function spaced(t,x,y,sp,align){
  const w=tw(t,sp);let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.textAlign='left';[...t].forEach(c=>{ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+sp;});
}
function cover(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function contain(im,x,y,w,h){const s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function card(r,rad,key,preview,outline){
  const pa=document.getElementById('panelop').value/100;
  /* soft shadow drawn only outside the panel, so the inside stays see-through */
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,W,H);rp(r.x,r.y,r.w,r.h,rad);ctx.clip('evenodd');
  ctx.shadowColor='rgba(0,0,0,.4)';ctx.shadowBlur=28;ctx.shadowOffsetY=10;
  ctx.fillStyle='#000';rr(r.x,r.y,r.w,r.h,rad);ctx.fill();
  ctx.restore();
  const fr=+document.getElementById('frost').value;
  if(fr>0&&img.bg){
    ctx.save();rr(r.x,r.y,r.w,r.h,rad);ctx.clip();
    ctx.fillStyle=document.getElementById('bgcolor').value;ctx.fillRect(r.x,r.y,r.w,r.h);
    drawBg(fr);
    ctx.fillStyle='rgba(255,255,255,.06)';ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.restore();
  }
  if(pa>0){
    ctx.save();ctx.globalAlpha=pa;
    const g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);g.addColorStop(0,'#1c1c1c');g.addColorStop(1,'#141414');
    ctx.fillStyle=g;rr(r.x,r.y,r.w,r.h,rad);ctx.fill();ctx.restore();
  }
  if(preview&&hot===key){ctx.save();ctx.fillStyle=rgba(A()[0],.12);rr(r.x,r.y,r.w,r.h,rad);ctx.fill();ctx.restore();}
}
function stroke(r,rad,key,preview,outline){
  rr(r.x+.5,r.y+.5,r.w-1,r.h-1,rad);ctx.lineWidth=1;
  ctx.strokeStyle=(preview&&hot===key)?grad(r.x,r.y,r.w,r.h):(outline?'rgba(255,255,255,.09)':'rgba(255,255,255,0)');ctx.stroke();
}
function label(t,cx,y,size,sp,col){ctx.fillStyle=col;ctx.font=`500 ${size}px ${F}`;spaced(t,cx,y,sp,'center');}
const HAS_FILTER=(()=>{try{return document.createElement('canvas').getContext('2d').filter==='none';}catch(e){return false;}})();
function drawBg(extra){
  const blur=(+document.getElementById('bgblur').value)+(extra||0),op=document.getElementById('bgop').value/100;
  ctx.save();ctx.globalAlpha=op;
  if(!blur){cover(img.bg,0,0,W,H);}
  else if(HAS_FILTER){const m=blur*2;ctx.filter='blur('+(blur*S)+'px)';cover(img.bg,-m,-m,W+2*m,H+2*m);}
  else{ /* fallback for browsers without canvas blur: shrink then stretch */
    const k=1+blur/2,sw=Math.max(8,Math.round(W/k)),sh=Math.max(8,Math.round(H/k));
    const a=document.createElement('canvas');a.width=sw;a.height=sh;
    const ac=a.getContext('2d');ac.imageSmoothingQuality='high';
    const s=Math.max(sw/img.bg.width,sh/img.bg.height),dw=img.bg.width*s,dh=img.bg.height*s;
    ac.drawImage(img.bg,(sw-dw)/2,(sh-dh)/2,dw,dh);
    ctx.imageSmoothingQuality='high';ctx.drawImage(a,-8,-8,W+16,H+16);
  }
  ctx.restore();
}
function pill(txt,x,y,fill,col){
  ctx.font=`600 13px ${F}`;const w=tw(txt,3)+30;
  ctx.fillStyle=fill==='ACC'?grad(x,y,w,30):fill;rr(x,y,w,30,15);ctx.fill();
  ctx.fillStyle=col;spaced(txt,x+15,y+20,3,'left');
}
function drawBA(preview,outline){
  [['before','BEFORE'],['after','AFTER']].forEach(([key,name])=>{
    const r=R[key];card(r,22,key,preview,outline);
    if(img[key]){
      ctx.save();rr(r.x,r.y,r.w,r.h,22);ctx.clip();
      if(key==='before'&&document.getElementById('mute').checked&&HAS_FILTER) ctx.filter='grayscale(1) brightness(.85)';
      ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
      contain(img[key],r.x+40,r.y+64,r.w-80,r.h-104);ctx.restore();
    }else if(preview) label('DROP '+name+' LOGO',r.x+r.w/2,r.y+r.h/2,15,3.5,'#8a8a8a');
    stroke(r,22,key,preview,outline);
    if(key==='before') pill(name,r.x+22,r.y+22,'rgba(255,255,255,.12)','#d0d0d0');
    else pill(name,r.x+22,r.y+22,'ACC','#161616');
  });
  const cx=W/2,cy=R.before.y+R.before.h/2;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.fillStyle=grad(cx-24,cy-24,48,48);ctx.beginPath();ctx.arc(cx,cy,24,0,Math.PI*2);ctx.fill();ctx.restore();
  ctx.strokeStyle='#161616';ctx.lineWidth=3;ctx.lineCap='round';ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(cx-9,cy);ctx.lineTo(cx+9,cy);ctx.moveTo(cx+2,cy-8);ctx.lineTo(cx+10,cy);ctx.lineTo(cx+2,cy+8);ctx.stroke();
}
function draw(preview){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle=document.getElementById('bgcolor').value;ctx.fillRect(0,0,W,H);
  if(img.bg) drawBg();
  const vg=ctx.createRadialGradient(W/2,H*.4,60,W/2,H*.5,W*.75);vg.addColorStop(0,'rgba(255,255,255,.03)');vg.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const outline=document.getElementById('frames').checked;
  if(layout==='ba'){drawBA(preview,outline);}else{
  /* thumbnail */
  let r=R.thumb;card(r,22,'thumb',preview,outline);
  if(img.thumb){ctx.save();rr(r.x,r.y,r.w,r.h,22);ctx.clip();cover(img.thumb,r.x,r.y,r.w,r.h);ctx.restore();}
  else if(preview) label('DROP THUMBNAIL',r.x+r.w/2,r.y+r.h/2,15,3.5,'#8a8a8a');
  stroke(r,22,'thumb',preview,outline);
  /* logo */
  r=R.logo;card(r,22,'logo',preview,outline);
  if(img.logo){
    ctx.save();rr(r.x,r.y,r.w,r.h,22);ctx.clip();
    const gl=ctx.createRadialGradient(r.x+r.w/2,r.y+r.h/2,10,r.x+r.w/2,r.y+r.h/2,r.w*.7);gl.addColorStop(0,rgba(A()[0],.14));gl.addColorStop(1,rgba(A()[0],0));
    ctx.fillStyle=gl;ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
    contain(img.logo,r.x+28,r.y+28,r.w-56,r.h-56);ctx.restore();
  }else if(preview) label('LOGO',r.x+r.w/2,r.y+r.h/2,15,3.5,'#8a8a8a');
  stroke(r,22,'logo',preview,outline);
  /* icon */
  r=R.icon;card(r,22,'icon',preview,outline);
  const ix=r.x+18,iy=r.y+(r.h-128)/2;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  ctx.fillStyle='#202020';rr(ix,iy,128,128,28);ctx.fill();ctx.restore();
  if(img.icon){ctx.save();rr(ix,iy,128,128,28);ctx.clip();cover(img.icon,ix,iy,128,128);ctx.restore();}
  rr(ix+.5,iy+.5,127,127,28);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.stroke();
  ctx.fillStyle='#bdbdbd';ctx.font=`500 22px ${F}`;ctx.textAlign='left';ctx.fillText('128px',ix+128+18,iy+62);
  ctx.fillStyle='#8a8a8a';ctx.font=`500 11px ${F}`;spaced('ICON SIZE',ix+128+18,iy+86,3,'left');
  stroke(r,22,'icon',preview,outline);
  }
  /* title + brand */
  const title=document.getElementById('title').value.toUpperCase(),brand=document.getElementById('brand').value.toUpperCase();
  ctx.fillStyle=grad(40,583,64,4);rr(40,582,64,4,2);ctx.fill();
  const TF=FONTS[document.getElementById('tfont').value]||FONTS.clean,fam=`"${TF.f}",${F}`;
  let fs=TF.s;ctx.font=`${TF.w} ${fs}px ${fam}`;
  while(fs>26&&tw(title,TF.sp)>690){fs-=2;ctx.font=`${TF.w} ${fs}px ${fam}`;}
  ctx.fillStyle='#fff';spaced(title,118,584+fs*.36,TF.sp,'left');
  ctx.fillStyle='#8a8a8a';ctx.font=`500 14px ${F}`;spaced(brand,W-40,590,4,'right');
}
const redraw=()=>draw(true);
function useFont(){const TF=FONTS[document.getElementById('tfont').value]||FONTS.clean;redraw();
  if(document.fonts&&document.fonts.load)document.fonts.load(`${TF.w} 40px "${TF.f}"`).then(redraw).catch(()=>{});}
document.getElementById('tfont').addEventListener('change',useFont);
function applyAccent(){const [c1,c2]=A();document.documentElement.style.setProperty('--orange',c1);document.documentElement.style.setProperty('--a2',c2);redraw();}
document.getElementById('preset').addEventListener('change',e=>{const [c1,c2]=PRESETS[e.target.value];document.getElementById('ac1').value=c1;document.getElementById('ac2').value=c2;applyAccent();});
['ac1','ac2'].forEach(id=>document.getElementById(id).addEventListener('input',applyAccent));
function setLayout(v){
  layout=v;R=LAY[v];hot=null;
  document.querySelectorAll('[data-for]').forEach(e=>{e.hidden=e.dataset.for!==v;});
  redraw();
}
document.getElementById('layout').addEventListener('change',e=>setLayout(e.target.value));
document.getElementById('mute').addEventListener('input',()=>redraw());
function load(key,file){
  if(!file||!file.type.startsWith('image/'))return;
  const im=new Image();im.onload=()=>{img[key]=im;redraw();};im.src=URL.createObjectURL(file);
}
const picker=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'});
let want=null;picker.addEventListener('change',()=>{load(want,picker.files[0]);picker.value='';});
const pick=k=>{want=k;picker.click();};
document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
const at=e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  return Object.keys(R).find(k=>{const r=R[k];return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;})||null;};
cv.addEventListener('click',e=>{const k=at(e);if(k)pick(k);});
cv.addEventListener('dragover',e=>{e.preventDefault();const k=at(e);if(k!==hot){hot=k;redraw();}});
cv.addEventListener('dragleave',()=>{hot=null;redraw();});
cv.addEventListener('drop',e=>{e.preventDefault();const k=at(e);hot=null;load(k||'bg',e.dataTransfer.files[0]);redraw();});
['title','brand','frames','bgcolor'].forEach(id=>document.getElementById(id).addEventListener('input',redraw));
document.getElementById('bgop').addEventListener('input',e=>{document.getElementById('opv').textContent=e.target.value+'%';redraw();});
document.getElementById('panelop').addEventListener('input',e=>{document.getElementById('pov').textContent=e.target.value+'%';redraw();});
document.getElementById('frost').addEventListener('input',e=>{document.getElementById('frv').textContent=e.target.value+'px';redraw();});
document.getElementById('bgblur').addEventListener('input',e=>{document.getElementById('blv').textContent=e.target.value+'px';redraw();});
document.getElementById('bgclear').addEventListener('click',()=>{img.bg=null;redraw();});
document.getElementById('reset').addEventListener('click',()=>{img={thumb:null,logo:null,icon:null,bg:null,before:null,after:null};document.getElementById('bgcolor').value='#151515';document.getElementById('preset').value='sunset';document.getElementById('tfont').value='clean';document.getElementById('ac1').value='#ff8a3d';document.getElementById('ac2').value='#ff4d6d';applyAccent();document.getElementById('bgop').value=40;document.getElementById('panelop').value=0;document.getElementById('frost').value=18;document.getElementById('frv').textContent='18px';document.getElementById('pov').textContent='0%';document.getElementById('bgblur').value=0;document.getElementById('blv').textContent='0px';document.getElementById('opv').textContent='40%';document.getElementById('title').value='Game Title';document.getElementById('brand').value='Jelann Arts';redraw();});
document.getElementById('dl').addEventListener('click',()=>{
  draw(false);
  cv.toBlob(b=>{
    const a=document.createElement('a'),n=(document.getElementById('title').value||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'post';
    a.href=URL.createObjectURL(b);a.download=n+(layout==='ba'?'-before-after':'-post')+'.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    redraw();
  },'image/png');
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
redraw();
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('500 20px Inter'),document.fonts.load('600 20px Inter')]).then(redraw);
</script>
</body>
</html>
