<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Post Template | Jelann Arts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#171717;--line:#2c2c2c;--text:#f2f0ea;--soft:#9a9a9a;--orange:#e8792b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:28px 20px 60px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:26px;font-weight:500;letter-spacing:-.01em}
.lead{color:var(--soft);margin:8px 0 22px;font-size:15px}
#stage{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);flex:1 1 200px}
input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none}
input[type=color]{width:100%;height:42px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--orange);margin-top:10px}
input:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 16px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
button:hover{border-color:var(--orange)}
button.go{background:var(--orange);border-color:var(--orange);color:#161616;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);padding:11px 4px}
.note{margin-top:14px;font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Twitter / X post template</h1>
  <p class="lead">Click or drop an image onto each frame (drop outside the frames to set the background), type the game title, then download the PNG (2400 &times; 1350, 16:9).</p>
  <canvas id="stage" width="2400" height="1350" role="img" aria-label="Post preview. Use the buttons below to add images."></canvas>
  <div class="row">
    <button type="button" data-pick="thumb">Choose thumbnail</button>
    <button type="button" data-pick="logo">Choose logo</button>
    <button type="button" data-pick="icon">Choose icon</button>
    <label class="chk"><input type="checkbox" id="frames" checked> Card outlines</label>
  </div>
  <div class="row">
    <button type="button" data-pick="bg">Choose background</button>
    <button type="button" id="bgclear">Remove background</button>
    <label class="f" style="flex:0 0 130px">Background color<input type="color" id="bgcolor" value="#151515"></label>
    <label class="f">Background opacity: <span id="opv">40%</span><input type="range" id="bgop" min="0" max="100" value="40"></label>
    <label class="f">Background blur: <span id="blv">0px</span><input type="range" id="bgblur" min="0" max="40" value="0"></label>
  </div>
  <div class="row">
    <label class="f">Game title<input type="text" id="title" value="Game Title" maxlength="40"></label>
    <label class="f">Right label<input type="text" id="brand" value="Jelann Arts" maxlength="30"></label>
    <button type="button" id="reset">Reset</button>
    <button type="button" class="go" id="dl">Download PNG</button>
  </div>
  <p class="note">Images stay on your device. They are only used to draw this preview and the PNG.</p>
</div>
<script>
const W=1200,H=675,S=2,OR='#e8792b';
const R={thumb:{x:40,y:40,w:816,h:459},logo:{x:884,y:40,w:276,h:276},icon:{x:884,y:344,w:276,h:155}};
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let img={thumb:null,logo:null,icon:null,bg:null},hot=null;
const F='Inter,system-ui,sans-serif';
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
const tw=(t,sp)=>{const ch=[...t];return ch.reduce((a,c)=>a+ctx.measureText(c).width,0)+sp*Math.max(0,ch.length-1);};
function spaced(t,x,y,sp,align){
  const w=tw(t,sp);let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.textAlign='left';[...t].forEach(c=>{ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+sp;});
}
function cover(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function contain(im,x,y,w,h){const s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function card(r,rad,key,preview,outline){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.45)';ctx.shadowBlur=28;ctx.shadowOffsetY=10;
  const g=ctx.createLinearGradient(0,r.y,0,r.y+r.h);g.addColorStop(0,'#1c1c1c');g.addColorStop(1,'#141414');
  ctx.fillStyle=g;rr(r.x,r.y,r.w,r.h,rad);ctx.fill();ctx.restore();
  if(preview&&hot===key){ctx.save();ctx.fillStyle='rgba(232,121,43,.10)';rr(r.x,r.y,r.w,r.h,rad);ctx.fill();ctx.restore();}
}
function stroke(r,rad,key,preview,outline){
  rr(r.x+.5,r.y+.5,r.w-1,r.h-1,rad);ctx.lineWidth=1;
  ctx.strokeStyle=(preview&&hot===key)?OR:(outline?'rgba(255,255,255,.09)':'rgba(255,255,255,0)');ctx.stroke();
}
function label(t,cx,y,size,sp,col){ctx.fillStyle=col;ctx.font=`500 ${size}px ${F}`;spaced(t,cx,y,sp,'center');}
const HAS_FILTER=(()=>{try{return document.createElement('canvas').getContext('2d').filter==='none';}catch(e){return false;}})();
function drawBg(){
  const blur=+document.getElementById('bgblur').value,op=document.getElementById('bgop').value/100;
  ctx.save();ctx.globalAlpha=op;
  if(!blur){cover(img.bg,0,0,W,H);}
  else if(HAS_FILTER){const m=blur*2;ctx.filter='blur('+(blur*S)+'px)';cover(img.bg,-m,-m,W+2*m,H+2*m);}
  else{ /* fallback for browsers without canvas blur: shrink then stretch */
    const k=1+blur/2,sw=Math.max(8,Math.round(W/k)),sh=Math.max(8,Math.round(H/k));
    const a=document.createElement('canvas');a.width=sw;a.height=sh;
    const ac=a.getContext('2d');ac.imageSmoothingQuality='high';
    const s=Math.max(sw/img.bg.width,sh/img.bg.height),dw=img.bg.width*s,dh=img.bg.height*s;
    ac.drawImage(img.bg,(sw-dw)/2,(sh-dh)/2,dw,dh);
    ctx.imageSmoothingQuality='high';ctx.drawImage(a,-8,-8,W+16,H+16);
  }
  ctx.restore();
}
function draw(preview){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle=document.getElementById('bgcolor').value;ctx.fillRect(0,0,W,H);
  if(img.bg) drawBg();
  const vg=ctx.createRadialGradient(W/2,H*.4,60,W/2,H*.5,W*.75);vg.addColorStop(0,'rgba(255,255,255,.03)');vg.addColorStop(1,'rgba(0,0,0,.4)');
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const outline=document.getElementById('frames').checked;
  /* thumbnail */
  let r=R.thumb;card(r,22,'thumb',preview,outline);
  if(img.thumb){ctx.save();rr(r.x,r.y,r.w,r.h,22);ctx.clip();cover(img.thumb,r.x,r.y,r.w,r.h);ctx.restore();}
  else if(preview) label('DROP THUMBNAIL',r.x+r.w/2,r.y+r.h/2,15,3.5,'#8a8a8a');
  stroke(r,22,'thumb',preview,outline);
  /* logo */
  r=R.logo;card(r,22,'logo',preview,outline);
  if(img.logo){
    ctx.save();rr(r.x,r.y,r.w,r.h,22);ctx.clip();
    const gl=ctx.createRadialGradient(r.x+r.w/2,r.y+r.h/2,10,r.x+r.w/2,r.y+r.h/2,r.w*.7);gl.addColorStop(0,'rgba(232,121,43,.10)');gl.addColorStop(1,'rgba(232,121,43,0)');
    ctx.fillStyle=gl;ctx.fillRect(r.x,r.y,r.w,r.h);
    ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=18;ctx.shadowOffsetY=6;
    contain(img.logo,r.x+28,r.y+28,r.w-56,r.h-56);ctx.restore();
  }else if(preview) label('LOGO',r.x+r.w/2,r.y+r.h/2,15,3.5,'#8a8a8a');
  stroke(r,22,'logo',preview,outline);
  /* icon */
  r=R.icon;card(r,22,'icon',preview,outline);
  const ix=r.x+18,iy=r.y+(r.h-128)/2;
  ctx.save();ctx.shadowColor='rgba(0,0,0,.5)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  ctx.fillStyle='#202020';rr(ix,iy,128,128,28);ctx.fill();ctx.restore();
  if(img.icon){ctx.save();rr(ix,iy,128,128,28);ctx.clip();cover(img.icon,ix,iy,128,128);ctx.restore();}
  rr(ix+.5,iy+.5,127,127,28);ctx.lineWidth=1;ctx.strokeStyle='rgba(255,255,255,.12)';ctx.stroke();
  ctx.fillStyle='#bdbdbd';ctx.font=`500 22px ${F}`;ctx.textAlign='left';ctx.fillText('128px',ix+128+18,iy+62);
  ctx.fillStyle='#8a8a8a';ctx.font=`500 11px ${F}`;spaced('ICON SIZE',ix+128+18,iy+86,3,'left');
  stroke(r,22,'icon',preview,outline);
  /* title + brand */
  const title=document.getElementById('title').value.toUpperCase(),brand=document.getElementById('brand').value.toUpperCase();
  ctx.fillStyle=OR;ctx.fillRect(40,583,56,3);
  let fs=54;ctx.font=`600 ${fs}px ${F}`;
  while(fs>26&&tw(title,2)>690){fs-=2;ctx.font=`600 ${fs}px ${F}`;}
  ctx.fillStyle='#fff';spaced(title,118,584+fs*.36,2,'left');
  ctx.fillStyle='#8a8a8a';ctx.font=`500 14px ${F}`;spaced(brand,W-40,590,4,'right');
}
const redraw=()=>draw(true);
function load(key,file){
  if(!file||!file.type.startsWith('image/'))return;
  const im=new Image();im.onload=()=>{img[key]=im;redraw();};im.src=URL.createObjectURL(file);
}
const picker=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'});
let want=null;picker.addEventListener('change',()=>{load(want,picker.files[0]);picker.value='';});
const pick=k=>{want=k;picker.click();};
document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
const at=e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  return Object.keys(R).find(k=>{const r=R[k];return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;})||null;};
cv.addEventListener('click',e=>{const k=at(e);if(k)pick(k);});
cv.addEventListener('dragover',e=>{e.preventDefault();const k=at(e);if(k!==hot){hot=k;redraw();}});
cv.addEventListener('dragleave',()=>{hot=null;redraw();});
cv.addEventListener('drop',e=>{e.preventDefault();const k=at(e);hot=null;load(k||'bg',e.dataTransfer.files[0]);redraw();});
['title','brand','frames','bgcolor'].forEach(id=>document.getElementById(id).addEventListener('input',redraw));
document.getElementById('bgop').addEventListener('input',e=>{document.getElementById('opv').textContent=e.target.value+'%';redraw();});
document.getElementById('bgblur').addEventListener('input',e=>{document.getElementById('blv').textContent=e.target.value+'px';redraw();});
document.getElementById('bgclear').addEventListener('click',()=>{img.bg=null;redraw();});
document.getElementById('reset').addEventListener('click',()=>{img={thumb:null,logo:null,icon:null,bg:null};document.getElementById('bgcolor').value='#151515';document.getElementById('bgop').value=40;document.getElementById('bgblur').value=0;document.getElementById('blv').textContent='0px';document.getElementById('opv').textContent='40%';document.getElementById('title').value='Game Title';document.getElementById('brand').value='Jelann Arts';redraw();});
document.getElementById('dl').addEventListener('click',()=>{
  draw(false);
  cv.toBlob(b=>{
    const a=document.createElement('a'),n=(document.getElementById('title').value||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'post';
    a.href=URL.createObjectURL(b);a.download=n+'-post.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    redraw();
  },'image/png');
});
window.addEventListener('dragover',e=>e.preventDefault());
window.addEventListener('drop',e=>e.preventDefault());
redraw();
if(document.fonts&&document.fonts.load)Promise.all([document.fonts.load('500 20px Inter'),document.fonts.load('600 20px Inter')]).then(redraw);
</script>
</body>
</html>
