<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Post Template | Jelann Arts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f0f0f;--panel:#171717;--line:#2c2c2c;--text:#f2f0ea;--soft:#9a9a9a;--orange:#e8792b}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;line-height:1.5;padding:28px 20px 60px}
.wrap{max-width:1000px;margin:0 auto}
h1{font-size:26px;font-weight:500;letter-spacing:-.01em}
.lead{color:var(--soft);margin:8px 0 22px;font-size:15px}
#stage{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:12px;margin-top:18px;align-items:end}
label.f{display:flex;flex-direction:column;gap:6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);flex:1 1 200px}
input[type=text]{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 12px;font:inherit;font-size:15px;letter-spacing:0;text-transform:none}
input[type=text]:focus-visible,button:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:11px 16px;font:inherit;font-size:14px;cursor:pointer;transition:border-color .2s}
button:hover{border-color:var(--orange)}
button.go{background:var(--orange);border-color:var(--orange);color:#161616;font-weight:600}
.chk{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--soft);padding:11px 4px}
.note{margin-top:14px;font-size:13px;color:var(--soft)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Twitter / X post template</h1>
  <p class="lead">Click or drop an image onto each frame, type the game title, then download the PNG (2400 &times; 1350, 16:9).</p>
  <canvas id="stage" width="2400" height="1350" role="img" aria-label="Post preview. Use the buttons below to add images."></canvas>
  <div class="row">
    <button type="button" data-pick="thumb">Choose thumbnail</button>
    <button type="button" data-pick="logo">Choose logo</button>
    <button type="button" data-pick="icon">Choose icon</button>
    <label class="chk"><input type="checkbox" id="frames" checked> Orange frames</label>
  </div>
  <div class="row">
    <label class="f">Game title<input type="text" id="title" value="Game Title" maxlength="40"></label>
    <label class="f">Right label<input type="text" id="brand" value="Jelann Arts" maxlength="30"></label>
    <button type="button" id="reset">Reset</button>
    <button type="button" class="go" id="dl">Download PNG</button>
  </div>
  <p class="note">Images stay on your device. They are only used to draw this preview and the PNG.</p>
</div>
<script>
const W=1200,H=675,S=2,OR='#e8792b';
const R={thumb:{x:48,y:48,w:853,h:480,k:'thumb'},logo:{x:929,y:48,w:223,h:226,k:'logo'},icon:{x:929,y:302,w:223,h:226,k:'icon'}};
const cv=document.getElementById('stage'),ctx=cv.getContext('2d');
let img={thumb:null,logo:null,icon:null},hot=null;
const rr=(x,y,w,h,r)=>{ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();};
function spaced(t,x,y,sp,align){
  const ch=[...t];let w=ch.reduce((a,c)=>a+ctx.measureText(c).width,0)+sp*(ch.length-1);
  let cx=align==='center'?x-w/2:align==='right'?x-w:x;
  ctx.textAlign='left';ch.forEach(c=>{ctx.fillText(c,cx,y);cx+=ctx.measureText(c).width+sp;});
}
function cover(im,x,y,w,h){const s=Math.max(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function contain(im,x,y,w,h){const s=Math.min(w/im.width,h/im.height),dw=im.width*s,dh=im.height*s;ctx.drawImage(im,x+(w-dw)/2,y+(h-dh)/2,dw,dh);}
function draw(preview){
  ctx.setTransform(S,0,0,S,0,0);
  ctx.fillStyle='#151515';ctx.fillRect(0,0,W,H);
  const frames=document.getElementById('frames').checked;
  for(const key in R){
    const r=R[key],im=img[key],cx=r.x+r.w/2,cy=r.y+r.h/2;
    ctx.save();rr(r.x,r.y,r.w,r.h,28);
    if(preview&&hot===key){ctx.fillStyle='rgba(232,121,43,.10)';ctx.fill();}
    ctx.restore();
    if(im){
      ctx.save();rr(r.x,r.y,r.w,r.h,28);ctx.clip();
      if(key==='thumb') cover(im,r.x,r.y,r.w,r.h);
      else if(key==='logo') contain(im,r.x+20,r.y+20,r.w-40,r.h-40);
      else {ctx.restore();ctx.save();rr(cx-64,cy-64,128,128,26);ctx.clip();cover(im,cx-64,cy-64,128,128);}
      ctx.restore();
    }else if(preview){
      ctx.fillStyle='#8f8f8f';
      const big=key==='thumb'?27:19,t={thumb:['DROP FULL THUMBNAIL','FULL THUMBNAIL'],logo:['DROP LOGO','STANDALONE'],icon:['128px','ICON SIZE']}[key];
      ctx.font=`400 ${big}px Inter,system-ui,sans-serif`;spaced(t[0],cx,cy-4,1.5,'center');
      ctx.font='500 '+(key==='thumb'?15:12)+'px Inter,system-ui,sans-serif';ctx.fillStyle='#7d7d7d';spaced(t[1],cx,cy+(key==='thumb'?28:24),key==='thumb'?4:3,'center');
    }
    if(frames){rr(r.x,r.y,r.w,r.h,28);ctx.lineWidth=1.5;ctx.strokeStyle=OR;ctx.stroke();}
  }
  ctx.fillStyle='#3a3a3a';ctx.fillRect(0,582,W,1);
  ctx.fillStyle='#8a8a8a';ctx.font='500 19px Inter,system-ui,sans-serif';
  spaced(document.getElementById('title').value.toUpperCase(),48,631,5,'left');
  spaced(document.getElementById('brand').value.toUpperCase(),W-48,631,5,'right');
}
const redraw=()=>draw(true);
function load(key,file){
  if(!file||!file.type.startsWith('image/'))return;
  const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{img[key]=im;redraw();};im.src=u;
}
const picker=Object.assign(document.createElement('input'),{type:'file',accept:'image/*'});
let want=null;picker.addEventListener('change',()=>{load(want,picker.files[0]);picker.value='';});
const pick=k=>{want=k;picker.click();};
document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click',()=>pick(b.dataset.pick)));
const at=e=>{const b=cv.getBoundingClientRect(),x=(e.clientX-b.left)*W/b.width,y=(e.clientY-b.top)*H/b.height;
  return Object.keys(R).find(k=>{const r=R[k];return x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h;})||null;};
cv.addEventListener('click',e=>{const k=at(e);if(k)pick(k);});
cv.addEventListener('dragover',e=>{e.preventDefault();const k=at(e);if(k!==hot){hot=k;redraw();}});
cv.addEventListener('dragleave',()=>{hot=null;redraw();});
cv.addEventListener('drop',e=>{e.preventDefault();const k=at(e);hot=null;if(k)load(k,e.dataTransfer.files[0]);else redraw();});
['title','brand','frames'].forEach(id=>document.getElementById(id).addEventListener('input',redraw));
document.getElementById('reset').addEventListener('click',()=>{img={thumb:null,logo:null,icon:null};document.getElementById('title').value='Game Title';document.getElementById('brand').value='Jelann Arts';redraw();});
document.getElementById('dl').addEventListener('click',()=>{
  draw(false);
  cv.toBlob(b=>{
    const a=document.createElement('a'),n=(document.getElementById('title').value||'post').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'post';
    a.href=URL.createObjectURL(b);a.download=n+'-post.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    redraw();
  },'image/png');
});
redraw();
(document.fonts&&document.fonts.load?Promise.all([document.fonts.load('400 20px Inter'),document.fonts.load('500 20px Inter')]).then(redraw):Promise.resolve());
</script>
</body>
</html>
